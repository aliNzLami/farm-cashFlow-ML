name: Model Recommendation Framework - Corn Dataset

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'   # Every Monday at midnight UTC

permissions:
  contents: write

jobs:
  recommend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install numpy pandas

      - name: Run model recommendation framework
        run: |
          python decision-model/framework_decision_corn.py

      - name: Commit and push results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corn_model_recommendation_results.txt
          git diff --staged --quiet || (git commit -m "🤖 Auto-update model recommendation results [skip ci]" && git push)
