name: Weather-Price Pattern Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'   # Every Monday at midnight UTC

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas matplotlib seaborn scipy numpy

      - name: Run analysis script
        run: |
          python scripts/analyze_weather_price.py

      - name: Commit and push outputs (if any)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --staged --quiet || (git commit -m "🤖 Auto-update weather-price analysis charts [skip ci]" && git push)
