name: Model Comparison - Random Forest vs ARIMA (Fixed)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 2'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install numpy pandas matplotlib scikit-learn statsmodels

      - name: Run model comparison
        run: |
          python compare_models.py

      - name: Commit and push results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ model_comparison_fixed_results.txt
          git diff --staged --quiet || (git commit -m "🤖 Auto-update model comparison results [skip ci]" && git push)
