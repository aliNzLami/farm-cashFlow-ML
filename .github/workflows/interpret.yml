name: Model Interpretability - SHAP, LIME, TreeInterpreter

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 3'

permissions:
  contents: write

jobs:
  interpret:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install core dependencies
        run: |
          pip install numpy pandas matplotlib scikit-learn

      - name: Run interpretability script
        run: |
          python forcasting-price.py

      - name: Commit and push results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --staged --quiet || (git commit -m "🤖 Auto-update interpretability results [skip ci]" && git push)
