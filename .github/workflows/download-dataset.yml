name: Download Kaggle Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install kagglehub pandas openpyxl

      - name: Set up Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download and copy dataset files
        run: |
          python -c "
          import shutil
          import kagglehub
          from pathlib import Path

          download_path = kagglehub.dataset_download('khimtagia/agricommodity-futures-multi-source-ml-dataset')
          print(f'Downloaded to: {download_path}')

          dest_dir = Path('dataset')
          dest_dir.mkdir(exist_ok=True)

          for file_path in Path(download_path).iterdir():
              if file_path.is_file():
                  shutil.copy2(file_path, dest_dir / file_path.name)
                  print(f'Copied: {file_path.name}')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add dataset/
          git diff --staged --quiet || (git commit -m "Add Kaggle dataset" && git push)
